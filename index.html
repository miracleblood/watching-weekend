<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watching Weekend">
<title>Watching Weekend</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="preconnect" href="https://api.openligadb.de">
<link rel="preconnect" href="https://api.jolpi.ca">
<link rel="preconnect" href="https://api.open-meteo.com">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="svw">
<header class="top">
  <div class="brand">
    <img src="icon.svg" alt="" class="brand-icon">
    <h1 class="logo">Watching Weekend<span>Formel 1 · Fußball · Wetter</span></h1>
  </div>
  <button id="refresh" class="icon-btn" aria-label="Aktualisieren">⟳</button>
</header>

<div id="bg-video" class="bg-video" aria-hidden="true"></div>
<div id="ptr" class="ptr">⟳</div>
<main id="view"></main>

<nav class="tabbar">
  <button data-tab="home" class="active"><span>🏠</span>Start</button>
  <button data-tab="f1"><span>🏎️</span>F1</button>
  <button data-tab="fussball"><span>⚽</span>Fußball</button>
  <button data-tab="watching"><span>📺</span>Watching</button>
  <button data-tab="kalender"><span>📅</span>Kalender</button>
  <button data-tab="wetter"><span>🌤️</span>Wetter</button>
</nav>

<div class="rotate-hint"><div class="ico">📱</div>Bitte das Handy hochkant halten</div>

<script src="app.js"></script>
</body>
</html>
